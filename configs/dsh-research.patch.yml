# Layer after the standard headless bundle and configs/cordis.patch.yml.
# Credential content is supplied only by scripts/run-research.py at process launch.
- id: agent-default-model
  config:
    provider: openai-codex
    model: !!js process.env.DQR_MODEL
- id: llm-pi-ai
  config:
    providers:
      openai-codex:
        apiKeyEnv: DQR_CODEX_ACCESS_TOKEN
        reasoning: low
        transport: sse
        timeoutMs: 120000
        retryPolicy:
          mode: normal
          maxRetries: 0
        models:
          - id: !!js process.env.DQR_MODEL
            maxTokens: 8192
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: session-title-llm
  disabled: true
- id: tools
  config:
    mode: native
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: >-
      You are the DQR fund strategy researcher. Use only DQR tools. Every claim
      about evaluation must cite actual tool results. Do not promote strategies.
      Observe the task's trial limit and read returned feedback before finishing.
- id: agent-instructions
  disabled: true
- id: plan-mode
  disabled: true
- id: tool-working-directory
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-web
  disabled: true
- id: tool-result-pruner
  disabled: true
