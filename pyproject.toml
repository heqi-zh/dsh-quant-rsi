[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-quant-rsi"
version = "0.1.0"
description = "DSH tools and reproducible OTC fund strategy research"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4", "polars==1.44.2", "scipy==1.18.1", "TA-Lib==0.6.8", "dacite==1.9.2", "PyYAML==6.0.3", "matplotlib==3.11.2"]

[project.scripts]
dqr = "dqr.__main__:main"

[tool.setuptools.packages.find]
where = ["runtime"]

[tool.setuptools.package-data]
"dqr.vendor.vnpy" = ["LICENSE", "provenance.json"]
"dqr.vendor.openevolve" = ["LICENSE", "provenance.json"]
"dqr" = ["web/*.html"]
