<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DQR · 基金观察</title>
<style>
:root{--ink:#282135;--muted:#766980;--line:#e9e2ef;--paper:#f7f4fa;--green:#7450bd;--orange:#bf672f;--blue:#705b9c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}a{color:var(--green);text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ccb7e8;outline-offset:3px}.shell{max-width:1440px;margin:auto;display:grid;grid-template-columns:190px minmax(0,1fr)}aside{padding:34px 22px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}.brand{font-size:28px;font-weight:800;letter-spacing:-1px}.brand span{color:var(--green)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}nav{display:grid;gap:9px;margin-top:52px}nav a{padding:11px 14px;color:var(--muted);border-radius:8px}nav a:first-child{color:var(--green);background:#ede5f6;font-weight:650}.aside-foot{position:absolute;bottom:28px;font-size:12px;color:var(--muted);max-width:140px}main{padding:34px 38px 60px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}h1{font-size:30px;letter-spacing:-1px;margin:5px 0 6px;line-height:1.4}h2{font-size:19px;margin:0}h3{font-size:16px;margin:0}.muted{color:var(--muted)}.date-control{background:white;border:1px solid var(--line);border-radius:8px;padding:9px 12px}.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:19px 20px}.stat .value{font-size:30px;line-height:1.3;font-weight:650;font-variant-numeric:tabular-nums;margin:8px 0}.stat small{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.picks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.pick{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px;min-width:0;color:var(--ink)}.pick.active{border-color:var(--green);box-shadow:0 0 0 1px var(--green);background:#faf6ff}.pick .name{display:block;font-size:13px;font-weight:650;min-height:44px}.pick .code{font-size:11px;color:var(--muted)}.pick strong{display:block;font-size:23px;margin-top:8px;font-variant-numeric:tabular-nums}.positive{color:var(--green)}.negative{color:var(--orange)}.chart-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:26px;margin-top:24px}.chart-head{display:flex;justify-content:space-between;gap:16px;align-items:center}.periods{display:flex;background:#f3eef8;padding:3px;border-radius:7px}.periods button{border:0;background:transparent;border-radius:5px;font-size:12px;padding:5px 9px;color:var(--muted)}.periods button.active{background:white;color:var(--ink);box-shadow:0 1px 3px #0001}.chart-wrap{position:relative;margin-top:10px;min-height:270px}.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}.tooltip{position:absolute;pointer-events:none;background:#312344ee;color:white;padding:8px 12px;border-radius:7px;font-size:12px;display:none;top:14px;left:70px;z-index:2}.chart-note{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:14px}.detail{border-left:1px solid var(--line);padding-left:24px}.chip{display:inline-block;font-size:11px;padding:3px 8px;background:#f1ebf7;border-radius:5px;color:var(--green)}.factor{margin-top:16px;font-size:13px}.factor strong{font-size:12px}.factor p{margin:5px 0;line-height:1.8}.factor.good strong{color:var(--green)}.factor.weak strong{color:var(--orange)}.model{padding:13px 14px;background:#f4f0fa;border-radius:9px;margin-top:18px;font-size:13px;line-height:1.9}.model strong{font-size:11px;color:var(--blue)}.model p{margin:5px 0 0}.factor-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}.barlabel{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.track{height:5px;border-radius:5px;background:#f0eaf5;margin-top:9px}.track span{display:block;height:100%;border-radius:5px;background:var(--green)}.themes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.theme{text-align:left;border:1px solid var(--line);background:#fcfafd;padding:12px;border-radius:8px;color:var(--ink)}.theme.active{outline:2px solid var(--green)}.theme b{display:block;font-size:12px}.theme strong{display:block;font-size:21px;font-weight:600;margin:4px 0}.theme small{font-size:10px;color:var(--muted)}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters input,.filters select{border:1px solid var(--line);border-radius:7px;background:white;padding:8px 11px;max-width:100%}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-variant-numeric:tabular-nums}th{font-size:11px;font-weight:500;color:var(--muted);text-align:right;border-bottom:1px solid var(--line);padding:12px 10px}td{text-align:right;padding:13px 10px;border-bottom:1px solid #f2edf6;font-size:12px}th:first-child,td:first-child{text-align:left}td button{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-align:left}td small{display:block;font-weight:400;color:var(--muted);font-size:10px}.pager{display:flex;justify-content:space-between;align-items:center;padding-top:18px;color:var(--muted);font-size:12px}.pager button{background:white;border:1px solid var(--line);border-radius:6px;padding:6px 12px;color:var(--ink)}.pager button:disabled{opacity:.35;cursor:default}footer{font-size:12px;color:var(--muted);margin-top:25px;line-height:1.9}footer p{margin:5px 0}.status{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:12px}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.empty{padding:30px;color:var(--muted);text-align:center}.weekly-link{white-space:nowrap;font-size:12px}
@media(min-width:1500px){main{padding-left:44px;padding-right:44px}}@media(max-width:1100px){.shell{grid-template-columns:150px minmax(0,1fr)}main{padding:26px 24px}.chart-layout{grid-template-columns:minmax(0,1fr)}.detail{border-left:0;padding:0;border-top:1px solid var(--line);padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.detail .model{grid-column:1/-1}.themes{grid-template-columns:repeat(4,1fr)}.pick{padding:11px}}@media(max-width:760px){.shell{display:block}aside{height:auto;position:static;padding:14px 20px;border-right:0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px}aside .eyebrow,.aside-foot{display:none}nav{display:flex;margin:0;gap:1px}nav a{font-size:12px;padding:6px 8px}main{padding:24px 16px}.topbar{flex-wrap:wrap}h1{font-size:26px}.overview{grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.stat{padding:14px}.stat .value{font-size:25px}.panel{padding:17px}.picks{display:flex;overflow:auto;padding:2px 2px 6px}.pick{min-width:143px}.themes{grid-template-columns:repeat(3,minmax(0,1fr))}.chart-layout{gap:16px}.chart-wrap{min-height:0}.chart-head{flex-wrap:wrap}.factor-bars{grid-template-columns:1fr 1fr}.detail{display:block}.section-head{align-items:flex-start;flex-wrap:wrap}.chart-note{display:block}.date-control{width:100%}.theme{padding:9px}.theme b{font-size:11px}.theme strong{font-size:18px}.theme small{font-size:9px}}
</style></head><body><div class="shell"><aside><div><div class="brand">DQR<span>●</span></div><div class="eyebrow">FUND OBSERVATORY</div></div><nav aria-label="页面导航"><a href="#daily">每日观察</a><a href="#themes">主题地图</a><a href="#universe">基金池</a></nav><div class="aside-foot"><a id="weekly-link" href="#">筛选程序周报 ↗</a><br>真实净值 · 程序筛选<br>每天读懂几只基金</div></aside><main id="daily"><header class="topbar"><div><div class="eyebrow">DAILY BRIEF / 基金日报</div><h1>看见机会，也看清风险。</h1><div class="muted" id="subtitle"></div></div><label class="date-control">报告日期 <select id="date" aria-label="报告日期"></select></label></header><section class="overview" id="overview" aria-label="数据概览"></section><p class="muted" id="quality" style="font-size:12px;margin-top:-12px"></p>
<section class="panel"><div class="section-head"><div><h2>今日值得关注</h2><p>同类评分结合主题分散规则，点击基金查看走势与关键因素。</p></div><span class="status" id="freshness"></span></div><div class="picks" id="picks"></div><div class="chart-layout"><div><div class="chart-head"><div><h3 id="chart-title"></h3><span class="muted" style="font-size:12px" id="chart-subtitle"></span></div><div class="periods" aria-label="图表观察期"><button data-period="20">20期</button><button data-period="60" class="active">60期</button><button data-period="120">120期</button></div></div><div class="chart-wrap"><svg id="chart" viewBox="0 0 720 310" role="img" aria-label="基金累计收益走势图"></svg><div class="tooltip" id="tooltip"></div></div><div class="chart-note"><span>含现金分红的累计收益 · 所选区间起点归零</span><span id="chart-range"></span></div><div class="factor-bars" id="bars"></div></div><div class="detail" id="detail"></div></div></section>
<section class="panel" id="themes"><div class="section-head"><div><h2>热门主题，放在一起看</h2><p>近20期收益中位数 · 标签按基金名称识别 · 点击主题筛选基金池</p></div><button id="clear-theme" class="date-control">全部主题</button></div><div class="themes" id="theme-grid"></div></section>
<section class="panel" id="universe"><div class="section-head"><div><h2>基金池</h2><p id="table-summary"></p></div><div class="filters"><input id="search" placeholder="搜索基金名称或代码" aria-label="搜索基金"><select id="status" aria-label="申购状态筛选"><option value="all">全部已评分</option><option value="open">开放申购</option><option value="picks">今日入选</option></select><select id="sort" aria-label="排序"><option value="score">综合评分</option><option value="return_20">20期收益</option><option value="drawdown_60">距近期高点</option></select></div></div><div class="table-scroll"><table><thead><tr><th>基金 / 代码</th><th>主题</th><th>同类名次</th><th>评分</th><th>20期收益</th><th>下行波动</th><th>距60期高点</th><th>净值日期</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><span id="page-info"></span><div><button id="prev">上一页</button> <button id="next">下一页</button></div></div></section>
<footer id="footer"></footer></main></div><script id="report-data" type="application/json">__REPORT_DATA__</script><script>
'use strict';
const D=JSON.parse(document.getElementById('report-data').textContent), R=D.report, $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>v==null?'暂无':`${v>0?'+':''}${(100*v).toFixed(2)}%`, tone=v=>v>=0?'positive':'negative';
const all=new Map(D.ranked.map(p=>[p.code,p])), themeNames=new Map(R.theme_coverage.map(t=>[t.id,t.name]));
let active=R.recommendations[0]?.code??D.ranked[0]?.code, period=60, theme='', page=0, pageSize=15;
$('#subtitle').textContent=`${R.date} · 净值截至 ${R.nav_cutoff}${R.preview?" · 页面预览，基金数据仍在补齐":""}`;
const week=D.weekly_dates.filter(d=>d<=R.date).at(-1);if(week)$('#weekly-link').href='../weekly/'+week+'.html';else $('#weekly-link').hidden=true;
$('#freshness').textContent=R.data_updated?'净值已更新':'沿用最近净值';
$('#date').innerHTML=D.report_days.map(d=>`<option ${d===R.date?'selected':''}>${esc(d)}</option>`).join('');$('#date').onchange=e=>location.href=e.target.value+'.html';
$('#quality').textContent=`数据状态：预热不足 ${R.exclusion_counts.insufficient_warmup||0} 只 · 暂无历史 ${R.exclusion_counts.no_history||0} 只 · 最新净值待齐 ${R.exclusion_counts.missing_latest_nav||0} 只。`;
$('#overview').innerHTML=[['覆盖基金',R.fund_count.toLocaleString(),'份额去重后的基金池'],['数据足够评分',R.scored_count.toLocaleString(),`至少 ${R.program.warmup_sessions} 期净值`],['开放申购记录',R.eligible_count.toLocaleString(),'交易前需复核最新状态'],['热门主题',R.theme_coverage.length,'同一基金可覆盖多个主题']].map(([label,v,note])=>`<div class="stat"><span class="muted">${label}</span><div class="value">${v}</div><small>${note}</small></div>`).join('');
function selectFund(code){active=code;renderPicks();renderChart();renderDetail()}
function renderPicks(){$('#picks').innerHTML=R.recommendations.map(p=>`<button class="pick ${p.code===active?'active':''}" data-code="${esc(p.code)}" aria-pressed="${p.code===active}"><span class="code">${esc(p.code)} · ${esc(themeNames.get(p.primary_theme)||p.category)}</span><span class="name">${esc(p.name)}</span><strong class="${tone(p.values.return_20)}">${pct(p.values.return_20)}</strong><small class="muted">近20期收益</small></button>`).join('')||'<p class="empty">本日暂无满足数据与分散条件的基金。</p>';$('#picks').querySelectorAll('button').forEach(b=>b.onclick=()=>selectFund(b.dataset.code))}
function renderDetail(){const p=all.get(active);if(!p)return;const s=D.summaries[p.code],opinion=D.opinions[p.code];$('#detail').innerHTML=`<div class="factor good"><strong>${esc(s.support_label)} · 程序解读</strong><p>${esc(s.support)}</p></div><div class="factor weak"><strong>${esc(s.weak_label)} · 程序解读</strong><p>${esc(s.weakness)}</p></div><div class="factor"><strong>观察重点</strong><p>${esc(s.caution)}</p><span class="chip">同类第 ${p.rank_in_category} / ${p.peer_count} · ${esc(p.purchase_status)}</span></div><div class="model"><strong>模型判断 · 解释与推断</strong><p>${esc(opinion||'本基金的模型解读尚未生成，当前展示程序计算结果。')}</p></div>`;
$('#bars').innerHTML=[['momentum_contribution',.4,'上涨动力'],['trend_contribution',.25,'近期趋势'],['risk_contribution',.2,'下跌稳定性'],['drawdown_contribution',.15,'距近期高点']].map(([k,w,n])=>`<div><div class="barlabel"><span>${n}</span><span>${(100*p.values[k]/w).toFixed(0)} / 100</span></div><div class="track"><span style="width:${Math.max(0,Math.min(100,100*p.values[k]/w))}%"></span></div></div>`).join('')}
function renderChart(){const p=all.get(active);if(!p)return;$('#chart-title').textContent=p.name;$('#chart-subtitle').textContent=`${p.code} · ${p.category} · 净值 ${p.nav.toFixed(4)}`;const series=(D.series[p.code]||[]).slice(-(period+1)), svg=$('#chart');if(series.length<2){svg.innerHTML='<text x="50" y="150" fill="#766980">可用净值不足，等待数据更新。</text>';return}const vals=series.map(x=>100*(x[1]/series[0][1]-1));let lo=Math.min(0,...vals),hi=Math.max(0,...vals),pad=Math.max((hi-lo)*.15,.3);lo-=pad;hi+=pad;const L=55,T=18,W=645,H=245,x=i=>L+W*i/(series.length-1),y=v=>T+H*(hi-v)/(hi-lo);const path=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');let grid='';for(let i=0;i<5;i++){let v=lo+(hi-lo)*i/4;grid+=`<line x1="${L}" x2="700" y1="${y(v)}" y2="${y(v)}" stroke="#f0eaf5"/><text x="44" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#766980">${v.toFixed(1)}%</text>`}for(let i of [0,Math.floor((series.length-1)/2),series.length-1])grid+=`<text x="${x(i)}" y="292" text-anchor="${i===0?'start':i===series.length-1?'end':'middle'}" font-size="11" fill="#766980">${series[i][0]}</text>`;
svg.innerHTML=`<defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8b5fc7" stop-opacity=".2"/><stop offset="100%" stop-color="#8b5fc7" stop-opacity=".01"/></linearGradient></defs>${grid}<line x1="${L}" x2="700" y1="${y(0)}" y2="${y(0)}" stroke="#d0c6dd" stroke-dasharray="4 4"/><path d="${path} L700,${T+H} L${L},${T+H} Z" fill="url(#area)"/><path d="${path}" fill="none" stroke="#7450bd" stroke-width="2.5" stroke-linejoin="round"/><circle cx="700" cy="${y(vals.at(-1))}" r="4" fill="#7450bd"/><g id="crosshair" visibility="hidden"><line id="cross-line" y1="${T}" y2="${T+H}" stroke="#b7a3cf" stroke-dasharray="3 3"/><circle id="cross-dot" r="5" fill="#7450bd" stroke="white" stroke-width="2"/></g><rect x="${L}" y="${T}" width="${W}" height="${H}" fill="transparent"/>`;
$('#chart-range').textContent=`${series[0][0]} — ${series.at(-1)[0]}`;svg.onpointermove=e=>{const rect=svg.getBoundingClientRect(),sx=(e.clientX-rect.left)*720/rect.width,i=Math.max(0,Math.min(series.length-1,Math.round((sx-L)/W*(series.length-1))));$('#crosshair').setAttribute('visibility','visible');$('#cross-line').setAttribute('x1',x(i));$('#cross-line').setAttribute('x2',x(i));$('#cross-dot').setAttribute('cx',x(i));$('#cross-dot').setAttribute('cy',y(vals[i]));$('#tooltip').style.display='block';$('#tooltip').textContent=`${series[i][0]} · 累计收益 ${vals[i]>=0?'+':''}${vals[i].toFixed(2)}%`};svg.onpointerleave=()=>{$('#crosshair').setAttribute('visibility','hidden');$('#tooltip').style.display='none'}}
document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=Number(b.dataset.period);document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x===b));renderChart()});
function renderThemes(){$('#theme-grid').innerHTML=R.theme_coverage.map(t=>`<button class="theme ${theme===t.id?'active':''}" data-theme="${esc(t.id)}" title="有历史 ${t.with_history} 只 · 预热完成 ${t.warmup_ready} 只 · 开放申购 ${t.eligible} 只" aria-pressed="${theme===t.id}" style="background:${t.median_return_20==null?'#f9f7fb':t.median_return_20>=0?'#f5effb':'#fbf4ed'}"><b>${esc(t.name)}</b><strong class="${tone(t.median_return_20)}">${pct(t.median_return_20)}</strong><small>可评分 ${t.scored} / 收录 ${t.discovered}</small></button>`).join('');$('#theme-grid').querySelectorAll('button').forEach(b=>b.onclick=()=>{theme=theme===b.dataset.theme?'':b.dataset.theme;page=0;renderThemes();renderTable();$('#universe').scrollIntoView({behavior:'smooth',block:'start'})})}
function renderTable(){const q=$('#search').value.trim().toLowerCase(),status=$('#status').value,key=$('#sort').value;const rows=D.ranked.filter(p=>(!q||p.name.toLowerCase().includes(q)||p.code.includes(q))&&(!theme||p.themes?.includes(theme))&&(status!=='open'||p.eligible)&&(status!=='picks'||p.selected)).sort((a,b)=>b.values[key]-a.values[key]||a.code.localeCompare(b.code));page=Math.min(page,Math.max(0,Math.ceil(rows.length/pageSize)-1));$('#table-summary').textContent=`${theme?themeNames.get(theme)+' · ':''}匹配 ${rows.length} 只 · 相对分越高，同类排名越靠前`;
$('#rows').innerHTML=rows.slice(page*pageSize,(page+1)*pageSize).map(p=>`<tr><td><button data-code="${esc(p.code)}">${esc(p.name)}<small>${esc(p.code)} · ${esc(p.category)}</small></button></td><td>${esc(themeNames.get(p.primary_theme)||'综合')}</td><td>${p.rank_in_category} / ${p.peer_count}</td><td>${(p.values.score*100).toFixed(1)}${p.peer_count<10?'<small>同类样本较少</small>':''}</td><td class="${tone(p.values.return_20)}">${pct(p.values.return_20)}</td><td>${(100*p.values.downside_volatility).toFixed(2)}%</td><td>${pct(p.values.drawdown_60)}</td><td>${esc(p.nav_date)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">暂无符合筛选条件的基金。</td></tr>';$('#rows').querySelectorAll('button').forEach(b=>b.onclick=()=>{selectFund(b.dataset.code);$('#picks').scrollIntoView({behavior:'smooth',block:'start'})});$('#page-info').textContent=rows.length?`第 ${page*pageSize+1}—${Math.min((page+1)*pageSize,rows.length)} 只 / 共 ${rows.length} 只`:'0 只';$('#prev').disabled=page===0;$('#next').disabled=(page+1)*pageSize>=rows.length}
$('#prev').onclick=()=>{page--;renderTable()};$('#next').onclick=()=>{page++;renderTable()};['search','status','sort'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',()=>{page=0;renderTable()}));$('#clear-theme').onclick=()=>{theme='';page=0;renderThemes();renderTable()};
$('#footer').innerHTML=`<p>程序口径：评分用于同类排序，图表基于实际净值与现金分红计算。每个主题最多1只、每个主题大类最多2只；名单用于进一步观察。</p><p>${esc(R.limitations.join(' '))}</p><p>数据时间：${esc(Object.entries(R.market_nav_dates).map(([m,d])=>(m==='domestic'?'境内':'海外')+'净值 '+d).join(' · '))}。完整精度与计算记录保存在原始数据文件。</p>`;
renderPicks();renderChart();renderDetail();renderThemes();renderTable();
</script></body></html>
